# Supply-chain policy for loam, copied from cairn's.
#
#   cargo deny check
#
# The allowlist below was written from what is actually in the tree, not from a
# template. Every entry appears in the dependency graph today; nothing is
# permitted speculatively, so adding a dependency under a new licence is a
# decision somebody has to make on purpose.

[graph]
all-features = true

[advisories]
# Any known vulnerability fails the build. A tool people keep years of project
# history in does not get to carry an advisory quietly.
yanked = "deny"
ignore = []

[licenses]
# loam is MIT. Every dependency here is permissive; nothing copyleft is listed,
# because a copyleft dependency would place obligations on everybody who links
# loam and quietly undo the reason for being MIT in the first place.
allow = [
    "MIT",
    "Apache-2.0",
    "Apache-2.0 WITH LLVM-exception",
    "BSD-3-Clause",
    "Unicode-3.0",
    "Unlicense",
    "Zlib",
]
confidence-threshold = 0.9

[bans]
# Two copies of the same crate is usually a dependency that needs updating
# rather than a fact of life, so it is worth being told about.
multiple-versions = "warn"
wildcards = "deny"
deny = []

[sources]
# Nothing from a git revision or a private registry: everything is a published
# crate anyone can audit.
unknown-registry = "deny"
unknown-git = "deny"
allow-registry = ["https://github.com/rust-lang/crates.io-index"]
