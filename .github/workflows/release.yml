name: release

# A tag `vX.Y.Z` builds loam for each platform below and publishes a GitHub
# release with the archives, so loam can be installed without Rust: by
# `install.sh`, by the action in `action.yml`, or by hand. Run by hand
# (workflow_dispatch), it builds and uploads the archives as artifacts and
# publishes nothing — the way to try a change to this file.

on:
  push:
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always

jobs:
  build:
    name: build (${{ matrix.target }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          # musl, so one Linux binary runs on any distribution.
          - { os: ubuntu-latest, target: x86_64-unknown-linux-musl }
          - { os: ubuntu-24.04-arm, target: aarch64-unknown-linux-musl }
          - { os: macos-latest, target: aarch64-apple-darwin }
          - { os: macos-latest, target: x86_64-apple-darwin }
    steps:
      - uses: actions/checkout@v7
      - if: runner.os == 'Linux'
        run: sudo apt-get update -q && sudo apt-get install -yq musl-tools
      # The toolchain is the one rust-toolchain.toml names; only the target is added.
      - run: rustup target add ${{ matrix.target }}
      - run: cargo build --release --locked --target ${{ matrix.target }}
      - name: Package
        shell: bash
        run: |
          name=loam-${{ matrix.target }}
          mkdir "$name"
          cp target/${{ matrix.target }}/release/loam LICENSE README.md "$name"/
          tar czf "$name.tar.gz" "$name"
          shasum -a 256 "$name.tar.gz" > "$name.tar.gz.sha256"
          # Every target here runs on the runner that built it, Rosetta
          # included: an archive that cannot say its version is not shipped.
          "$name/loam" --version
      - uses: actions/upload-artifact@v7
        with:
          name: loam-${{ matrix.target }}
          path: loam-${{ matrix.target }}.tar.gz*
          if-no-files-found: error

  publish:
    needs: build
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v7
      - name: The tag matches the version loam reports
        run: |
          version=$(sed -n 's/^version = "\(.*\)"/\1/p' Cargo.toml | head -1)
          test "v$version" = "$GITHUB_REF_NAME" || {
            echo "tag $GITHUB_REF_NAME, but Cargo.toml says $version"; exit 1; }
      - uses: actions/download-artifact@v8
        with:
          path: dist
          merge-multiple: true
      - env:
          GH_TOKEN: ${{ github.token }}
        run: gh release create "$GITHUB_REF_NAME" dist/* --title "loam $GITHUB_REF_NAME" --generate-notes
