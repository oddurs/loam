name: ci

on:
  push:
    branches: [main]
  pull_request:

# A new push to a branch makes the run in flight pointless.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always
  # cairn checks this repository's backlog. Pinned to a commit rather than a
  # release, because the items use `closed_at`, which no release has yet; and
  # pinned at all, so a change to cairn cannot fail a build that changed nothing.
  CAIRN_REV: 3d67f0c7ea5799d1da59f39513737567d769e331

jobs:
  check:
    # Both: loam compares paths exactly (spec §2), and macOS is where a
    # filesystem that ignores case would hide it if it did not.
    name: check (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]
    steps:
      - uses: actions/checkout@v7
        with:
          # The whole history: `loam check --stale` compares pages against it,
          # and a shallow clone would make every page look freshly written.
          fetch-depth: 0
      # rustup installs the toolchain named in rust-toolchain.toml on the first
      # cargo invocation, so there is nothing to pin twice.
      - uses: Swatinem/rust-cache@v2
      - uses: taiki-e/install-action@v2
        with:
          tool: cargo-deny
      - uses: actions/setup-python@v7
        with:
          python-version: "3.13"
      - run: python3 -m pip install pyyaml
      - name: Install cairn
        run: cargo install --locked --git https://github.com/oddurs/cairn --rev "$CAIRN_REV" cairn-md
      - run: make check

  # The action in action.yml, as another repository would use it: it installs
  # the latest release — no Rust — and checks these pages with it.
  action:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: ./
      - uses: ./
        with:
          args: search stale
